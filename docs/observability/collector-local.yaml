# Local OpenTelemetry Collector for trying the Azure pipeline shape without Azure (milestone 32):
# same receivers/processors as collector-azure-monitor.yaml, exporting to the console instead.
#   docker run --rm -p 127.0.0.1:4318:4318 -v "$PWD/docs/observability/collector-local.yaml:/etc/otelcol/config.yaml:ro" \
#     otel/opentelemetry-collector-contrib:0.161.0 --config /etc/otelcol/config.yaml
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  cumulativetodelta:
  attributes/scrub:
    actions:
      - { key: http.target, action: delete }
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
  batch:
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, cumulativetodelta, batch]
      exporters: [debug]
